{% extends "activity_layout.html" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/toy_guessing_game.css') }}?v=1">
<script src="{{ url_for('static', filename='js/toy_guessing_game.js') }}?v=1" defer></script>
{% endblock %}

{% block title %}Toy Guessing Game{% endblock %}

{% block content %}

<div class="toy-page">

  <div class="incoming-call-screen" id="incomingCallScreen">
    <div class="incoming-bg"></div>

    <div class="incoming-content">
      <div class="incoming-copy">
        <h1>Toy Store Worker is ready</h1>
        <p><span>Toy Store Worker</span> wants to play Toy Guessing Game.</p>
      </div>

      <div class="incoming-avatar-area">
        <span class="call-ring ring-one"></span>
        <span class="call-ring ring-two"></span>
        <span class="call-ring ring-three"></span>

        <span class="music-note note-one">♪</span>
        <span class="music-note note-two">♫</span>

        <div class="incoming-avatar">
          <img src="{{ url_for('static', filename='images/toy_worker_pfp.png') }}" alt="Toy store worker profile picture">
        </div>
      </div>

      <div class="incoming-actions">
        <button class="incoming-btn decline-btn" id="declineCall" type="button" aria-label="Decline call">
          ☎
        </button>

        <button class="incoming-btn accept-btn" id="acceptCall" type="button" aria-label="Accept call">
          ☎
        </button>
      </div>

      <div class="incoming-labels">
        <span>Decline</span>
        <span>Accept</span>
      </div>
    </div>
  </div>

  <main class="toy-stage call-hidden" id="toyStage">

    <section class="character-fullscreen">

      <div class="character-wrap">
        <img
          src="{{ url_for('static', filename='images/toy_worker.png') }}"
          alt="Toy store worker"
          class="main-character"
        >

        <img
          src="{{ url_for('static', filename='images/toyworker-mouth-closed.png') }}"
          alt=""
          class="character-mouth-img"
          id="characterMouth"
        >
      </div>

    </section>

    <div class="toy-status" id="toyStatus" aria-live="polite"></div>

    <div class="toy-response-panel hide" id="toyResponsePanel" aria-label="Optional response buttons"></div>

  </main>

  <div class="call-controls">

    <a href="{{ url_for('dashboard') }}" class="back-link">
      ← Back to Dashboard
    </a>

    <div class="controls-center">
      <div class="control-button mic-control">🎙️</div>
      <div class="control-button">🎥</div>

      <button class="hangup-button" id="hangupBtn" type="button" aria-label="End call">
        ☎
      </button>

      <div class="control-button">💬</div>
      <div class="control-button">⋯</div>
    </div>

  </div>

</div>

{% endblock %}
