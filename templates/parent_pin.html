{% extends "base.html" %}

{% block title %}Parent PIN{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/parent_pin.css') }}">
{% endblock %}

{% block content %}
<div class="pin-page">

    <h1 class="pin-title">Enter your parent PIN</h1>

    <p class="pin-subtitle">
        Enter your four-digit PIN to access the dashboard.
    </p>

    <form method="POST" class="pin-form">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="parentPin" class="sr-only">
            Four-digit parent PIN
        </label>

        <input
            type="text"
            id="parentPin"
            name="parent_pin"
            maxlength="4"
            inputmode="numeric"
            minlength="4"
            pattern="[0-9]{4}"
            autocomplete="one-time-code"
            placeholder="••••"
            required
            autofocus
            class="pin-input pin-masked-input"
            data-pin-mask
        >

        {% if error %}
        <div class="pin-error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <button type="submit" class="pin-button">
            Continue
        </button>

        <a
            href="{{ url_for('forgot_parent_pin') }}"
            class="pin-text-link"
        >
            Forgot your PIN?
        </a>
    </form>

</div>
{% endblock %}
