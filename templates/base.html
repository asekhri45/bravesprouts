<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MyBraveSprout{% endblock %}</title>

    {% block head %}{% endblock %}

    <!-- Browser tabs and Google Search favicon -->
<link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="https://www.mybravesprout.com/static/images/favicon-96x96.png"
>

<link
    rel="shortcut icon"
    type="image/x-icon"
    href="https://www.mybravesprout.com/static/images/favicon.ico"
>

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://www.mybravesprout.com/static/images/logo-512x512.png"
>

<!-- Link previews for social media and messaging platforms -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="MyBraveSprout">
<meta
    property="og:title"
    content="MyBraveSprout | Free Selective Mutism Games for Kids"
>
<meta
    property="og:description"
    content="Free, parent-guided conversation games that help children with selective mutism build confidence one small step at a time."
>
<meta
    property="og:image"
    content="https://www.mybravesprout.com/static/images/social_preview.png"
>
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta
    property="og:image:alt"
    content="MyBraveSprout, free selective mutism conversation games for kids"
>

<meta name="twitter:card" content="summary_large_image">
<meta
    name="twitter:title"
    content="MyBraveSprout | Free Selective Mutism Games for Kids"
>
<meta
    name="twitter:description"
    content="Free, parent-guided conversation games for children with selective mutism."
>
<meta
    name="twitter:image"
    content="https://www.mybravesprout.com/static/images/social_preview.png"
>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">

    <!--
      Owns the visual masking of the four-digit parent PIN. Loaded here because
      PIN fields appear on several pages (the gate, setup, reset, and the
      dashboard setup modal) and masking must never depend on a page happening
      to include it. Deferred so it runs after the DOM is parsed.
    -->
    <script defer src="{{ url_for('static', filename='js/pin-mask.js') }}?v=3"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18300860067">
</script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'AW-18300860067');
</script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E018EPCBS6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-E018EPCBS6');
    </script>

    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xlb7s498s3");
</script>

</head>

<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
</body>
</html>
