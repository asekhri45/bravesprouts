{% extends "activity_layout.html" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mystery_animal.css') }}?v=11">
<script src="{{ url_for('static', filename='js/game-diagnostics.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/game-audio-manager.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/mystery_animal.js') }}?v=12" defer></script>
{% endblock %}

{% block title %}Mystery Animal{% endblock %}

{% block content %}

<div
  class="animal-page"
  data-activity-id="{{ activity.activity_id if activity else 2 }}"
  data-child-name="{{ child|e }}"
>

  <div class="incoming-call-screen" id="incomingCallScreen">
    <div class="incoming-bg"></div>

    <div class="incoming-content">
      <div class="incoming-copy">
        <h1>Star is ready</h1>
        <p><span>Star</span> wants to play Mystery Animal.</p>
      </div>

      <div class="incoming-avatar-area">
        <span class="call-ring ring-one"></span>
        <span class="call-ring ring-two"></span>
        <span class="call-ring ring-three"></span>

        <span class="music-note note-one">♪</span>
        <span class="music-note note-two">♫</span>

        <div class="incoming-avatar">
          <img src="{{ url_for('static', filename='images/starpfp.png') }}" alt="Star profile picture">
        </div>
      </div>

      <div class="incoming-actions">
        <button class="incoming-btn decline-btn" id="declineCall" type="button" aria-label="Decline call">
          ☎
        </button>

        <button class="incoming-btn accept-btn" id="acceptCall" type="button" aria-label="Accept call">
          ☎
        </button>
      </div>

      <div class="incoming-labels">
        <span>Decline</span>
        <span>Accept</span>
      </div>
    </div>
  </div>

  <main class="animal-stage call-hidden" id="animalStage">

    <section class="star-fullscreen">

      <div class="star-wrap">
        <img
          src="{{ url_for('static', filename='images/matching-star.svg') }}"
          alt="Star character"
          class="main-star"
        >

        <img
          src="{{ url_for('static', filename='images/mouth-closed.png') }}"
          alt=""
          class="star-mouth-img"
          id="starMouth"
        >
      </div>

    </section>

    <div class="animal-status" id="animalStatus" aria-live="polite">
      Star is thinking.
    </div>

    <div class="animal-response-panel hide" id="animalResponsePanel" aria-label="Optional response buttons"></div>

    <div class="animal-round-card" id="roundCard" aria-live="polite">
      <span>Round</span>
      <strong id="roundNumber">1 of 9</strong>
    </div>

  </main>

  <div class="call-controls">

    <a href="{{ url_for('dashboard') }}" class="back-link">
      ← Back to Dashboard
    </a>

    <div class="controls-center">
      <div class="control-button mic-control" id="micControl">🎙️</div>
      <div class="control-button">🎥</div>

      <button class="hangup-button" id="hangupBtn" type="button" aria-label="End call">
        ☎
      </button>

      <div class="control-button">💬</div>
      <div class="control-button">⋯</div>
    </div>

  </div>

</div>

{% endblock %}
