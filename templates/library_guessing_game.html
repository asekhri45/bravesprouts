{% extends "activity_layout.html" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/library_guessing_game.css') }}?v=2">
<script src="{{ url_for('static', filename='js/game-diagnostics.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/game-audio-manager.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/game-mic-manager.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/library_guessing_game.js') }}?v=3" defer></script>
{% endblock %}

{% block title %}Classroom Guessing Game{% endblock %}

{% block content %}

<div class="guess-page" data-activity-id="{{ activity.activity_id if activity else 6 }}">

  <div class="incoming-call-screen" id="incomingCallScreen">
    <div class="incoming-bg"></div>

    <div class="incoming-content">
      <div class="incoming-copy">
        <h1>Incoming Call</h1>
        <p><span>Teacher</span> is calling you...</p>
      </div>

      <div class="incoming-avatar-area">
        <span class="call-ring ring-one"></span>
        <span class="call-ring ring-two"></span>
        <span class="call-ring ring-three"></span>

        <span class="music-note note-one">♪</span>
        <span class="music-note note-two">♫</span>

        <div class="incoming-avatar">
          <img src="{{ url_for('static', filename='images/librarianpfp.png') }}" alt="Teacher profile picture">
        </div>
      </div>

      <div class="incoming-actions">
        <button class="incoming-btn decline-btn" id="declineCall" type="button">☎</button>
        <button class="incoming-btn accept-btn" id="acceptCall" type="button">☎</button>
      </div>

      <div class="incoming-labels">
        <span>Decline</span>
        <span>Accept</span>
      </div>
    </div>
  </div>

  <main class="guess-stage call-hidden" id="guessStage">

    <div class="guess-round-card" id="guessRoundCard" aria-live="polite">
      <span>Round</span>
      <strong><span id="guessRoundNumber">1</span> of 3</strong>
    </div>

    <div class="guess-status" id="guessStatus"></div>
    <div class="guess-response-panel hide" id="guessResponsePanel"></div>

    <section class="star-fullscreen">
      <div class="star-wrap librarian-wrap">
        <img
          src="{{ url_for('static', filename='images/librarian.png') }}"
          alt="Teacher character"
          class="main-star main-librarian"
        >

        <img
          src="{{ url_for('static', filename='images/librarian-mouth-closed.png') }}"
          alt=""
          class="star-mouth-img librarian-mouth-img"
          id="librarianMouth"
        >
      </div>
    </section>

  </main>

  <div class="call-controls">

    <a href="{{ url_for('dashboard') }}" class="back-link">
      ← Back to Dashboard
    </a>

    <div class="controls-center">
      <div class="control-button mic-control">🎙️</div>
      <div class="control-button">🎥</div>
      <button class="hangup-button" id="hangupBtn" type="button">☎</button>
      <div class="control-button">💬</div>
      <div class="control-button">⋯</div>
    </div>

  </div>

</div>

{% endblock %}
