{% extends "activity_layout.html" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mystery_food_item.css') }}?v=704">
<script src="{{ url_for('static', filename='js/game-diagnostics.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/game-audio-manager.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/game-mic-manager.js') }}?v=1" defer></script>
<script src="{{ url_for('static', filename='js/mystery_food_item.js') }}?v=705" defer></script>
{% endblock %}

{% block title %}Mystery Food Item{% endblock %}

{% block content %}
<div
  class="animal-page mystery-food-page"
  data-activity-id="{{ activity.activity_id if activity else 10 }}"
  data-child-name="{{ child|e }}"
>
  <div class="mystery-invite incoming-call-screen" id="incomingCallScreen">
    <div class="invite-backdrop incoming-bg" aria-hidden="true"></div>

    <div class="invite-card incoming-content">
      <div class="invite-kicker">Leo is ready</div>
      <h1>Leo is at the counter.</h1>
      <p><span>Leo</span> wants to play Mystery Food Item.</p>

      <div class="invite-avatar incoming-avatar" aria-hidden="true">
        <img src="{{ url_for('static', filename='images/restaurant/restaurant-worker-pfp.png') }}" alt="">
      </div>

      <div class="invite-actions incoming-actions">
        <button class="invite-secondary incoming-btn decline-btn" id="declineCall" type="button" aria-label="Decline activity">
          Not now
        </button>
        <button class="invite-primary incoming-btn accept-btn" id="acceptCall" type="button" aria-label="Start activity">
          Start
        </button>
      </div>
    </div>
  </div>

  <main class="mystery-stage animal-stage call-hidden" id="animalStage" aria-label="Mystery Food Item with Leo">
    <header class="mystery-topbar">
      <div class="animal-round-card" id="roundCard" aria-live="polite">
        <span>Round</span>
        <strong id="roundNumber">1 of 9</strong>
      </div>

      <div class="animal-status mic-pill" id="animalStatus" aria-live="polite">
        Leo is thinking.
      </div>

      <a href="{{ url_for('dashboard') }}" class="mystery-back">← Back to<br>Dashboard</a>
    </header>

    <section class="restaurant-scene" aria-label="Leo behind the restaurant counter">
      <div class="restaurant-bg-top" aria-hidden="true"></div>
      <div class="restaurant-warmth" aria-hidden="true"></div>

      <section class="leo-layer" aria-label="Leo">
        <div class="leo-wrap" id="workerSlot">
          <img
            class="leo-img"
            id="workerCharacter"
            src="{{ url_for('static', filename='images/restaurant/restaurant-worker-mouth-closed.png') }}"
            alt="Leo"
          >
        </div>
      </section>

      <img
        class="restaurant-bg-bottom"
        src="{{ url_for('static', filename='images/restaurant/restaurant-bg-bottom.png') }}"
        alt=""
        aria-hidden="true"
      >

      <div class="animal-response-panel hide" id="animalResponsePanel" aria-label="Optional response buttons"></div>
      <button class="hidden" id="hangupBtn" type="button" aria-label="End activity">End</button>
    </section>
  </main>
</div>
{% endblock %}
