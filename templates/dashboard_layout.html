{% extends "base.html" %}

{% block title %}BraveSprouts{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard_layout.css') }}?v=6">
<script src="{{ url_for('static', filename='js/chart.umd.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}" defer></script>
{% endblock %}

{% block content %}

<div class="dashboard-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img
        src="{{ url_for('static', filename='images/logo_v2.png') }}"
        class="logo"
        alt="BraveSprouts logo"
      >
    </div>

    <nav class="sidebar-nav">
      <a href="{{ url_for('dashboard') }}" class="sidebar-item {% if active_page == 'dashboard' %}active{% endif %}">
        <img src="{{ url_for('static', filename='images/' + ('dashboard_selected.png' if active_page == 'dashboard' else 'dashboard_unselected.png')) }}" class="sidebar-icon">
        <span>Dashboard</span>
      </a>

      <a href="{{ url_for('lessons') }}" class="sidebar-item {% if active_page == 'lessons' %}active{% endif %}">
        <img src="{{ url_for('static', filename='images/' + ('progression_selected.png' if active_page == 'lessons' else 'progression_unselected.png')) }}" class="sidebar-icon">
        <span>Progression</span>
      </a>

      <a href="{{ url_for('settings') }}" class="sidebar-item {% if active_page == 'settings' %}active{% endif %}">
        <img src="{{ url_for('static', filename='images/' + ('settings_selected.png' if active_page == 'settings' else 'settings_unselected.png')) }}" class="sidebar-icon">
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-image-widget">
      <img
        src="{{ url_for('static', filename='images/widget.png') }}"
        alt="Sidebar widget"
      >
    </div>
  </aside>

  <div class="dashboard-right">
    <main class="dashboard-main">
      {% block dashboard_content %}{% endblock %}
    </main>
  </div>

</div>

{% endblock %}
