{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 80px auto; font-family: sans-serif;">
  <h1>Admin Login</h1>

  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}

  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required style="width:100%; padding:10px; margin:8px 0 16px;">

    <label>Password</label>
    <input type="password" name="password" required style="width:100%; padding:10px; margin:8px 0 16px;">

    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
